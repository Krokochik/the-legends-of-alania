<div class="layer layer--green" [class.layer--active]="activeLayer() === 'green'">
    <ng-container #layerGreen></ng-container>
</div>

<div class="layer layer--blue" [class.layer--active]="activeLayer() === 'blue'">
    <ng-container #layerBlue></ng-container>
</div>

<div class="router-host" #routerHost>
    <animated-router-outlet #outlet="outlet" (activate)="onActivate($event, outlet)" />
</div>

<div class="overlay-layer">
    <ng-container #layerOverlay></ng-container>
</div>
